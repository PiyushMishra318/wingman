name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing alpha tag to rebuild assets for (e.g. v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Determine release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
              echo "Invalid alpha tag: $INPUT_TAG" >&2
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git log -1 --pretty=%B | grep -qF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=[skip release] in commit message" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git describe --tags --exact-match HEAD 2>/dev/null | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=HEAD already has an alpha tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="$(git tag -l 'v*-alpha*' --sort=-v:refname | head -n1 || true)"

          if [ -z "$LATEST" ]; then
            echo "tag=v0.1.0-alpha.1" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "bump=initial" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$LATEST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-alpha\.([0-9]+)$ ]]; then
            echo "Latest tag has unexpected format: $LATEST" >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          ALPHA="${BASH_REMATCH[4]}"

          COUNT="$(git rev-list "${LATEST}..HEAD" --count)"
          if [ "$COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no commits since $LATEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOG="$(git log "${LATEST}..HEAD" --pretty=format:%s%n%b)"

          bump_level=patch

          if echo "$LOG" | grep -qiE '(^|: )!|BREAKING[ -]CHANGE|BREAKING:'; then
            bump_level=minor
          elif echo "$LOG" | grep -qE '(^| )feat(\([^)]+\))?:'; then
            bump_level=minor
          fi

          if [ "$bump_level" = "minor" ]; then
            if [ "$MAJOR" -eq 0 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            fi
            ALPHA=1
          else
            ALPHA=$((ALPHA + 1))
          fi

          NEXT="v${MAJOR}.${MINOR}.${PATCH}-alpha.${ALPHA}"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "bump=$bump_level" >> "$GITHUB_OUTPUT"
          echo "previous=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Skip release
        if: steps.version.outputs.skip == 'true'
        shell: bash
        run: echo "Skipping release (${{ steps.version.outputs.reason }})"

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version: "1.25"
          cache: true

      - name: Build wingman.exe
        if: steps.version.outputs.skip != 'true'
        run: go build -o wingman.exe ./cmd/wingman

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: wingman.exe
          generate_release_notes: true
          overwrite_files: true
          prerelease: true
